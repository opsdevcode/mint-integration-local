name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --no-cache-dir -e ".[dev]"
      - name: Conformance
        run: python scripts/run_conformance.py
      - name: Tests
        run: python -m pytest -q --strict-markers

  github-assets:
    name: GitHub Release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Download and verify immutable release
        run: |
          set -euo pipefail
          TAG=v0.2.0-alpha.1
          WHEEL=mint_integration_local-0.2.0a1-py3-none-any.whl
          EXPECTED=591e1b3ebdd7e4f9373996e0cdeafa62d8fea39d2640ded8270ff2e59c68094d
          mkdir -p /tmp/mint-github-assets
          cd /tmp/mint-github-assets
          curl -fsSL -O "https://github.com/opsdevcode/mint-integration-local/releases/download/${TAG}/SHA256SUMS"
          awk '{print $2}' SHA256SUMS | sed 's|^\./||' | while read -r file; do
            curl -fsSL -O "https://github.com/opsdevcode/mint-integration-local/releases/download/${TAG}/${file}"
          done
          shasum -a 256 -c SHA256SUMS
          actual=$(shasum -a 256 "${WHEEL}" | awk '{print $1}')
          test "${actual}" = "${EXPECTED}"
          python -m venv /tmp/mint-local-wheel
          /tmp/mint-local-wheel/bin/pip install --no-cache-dir --no-index "./${WHEEL}"
          /tmp/mint-local-wheel/bin/python -c "from importlib.metadata import version; assert version('mint-integration-local') == '0.2.0a1'"
